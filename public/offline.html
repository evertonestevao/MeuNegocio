<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17222f" />
    <title>Sem conexão · MeuNegócio</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background: radial-gradient(120% 80% at 50% 30%, #24344a 0%, #17222f 60%, #101823 100%);
        color: #f4f6f9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { display: flex; max-width: 320px; flex-direction: column; align-items: center; gap: 12px; }
      svg { width: 72px; height: 72px; margin-bottom: 12px; }
      h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0; color: #c3ccd8; font-size: 15px; line-height: 1.5; }
      button {
        min-height: 48px; margin-top: 16px; padding: 0 28px; border: 0; border-radius: 12px;
        background: #f0b429; color: #17222f; font: inherit; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#f0b429" /><path d="M22 76V24h15l13 24 13-24h15v52H63V49L50 72 37 49v27z" fill="#17222f" /></svg>
      <h1>Sem conexão</h1>
      <p>O MeuNegócio precisa de internet para mostrar seus dados sempre atualizados. Verifique a conexão e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
